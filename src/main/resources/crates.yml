# ===== กล่องสุ่ม =====
#
# weight      = น้ำหนักการสุ่ม ยิ่งเลขน้อยยิ่งหายาก (weight <= 2 จะประกาศทั้งเซิร์ฟ)
# point-price = ราคากุญแจเป็นพ้อย ใส่แล้วกล่องนี้จะไปโผล่ในร้านพ้อย
#               ไม่ใส่หรือใส่ 0 = ไม่ขาย แจกเอาเองผ่าน /crate key
# blurb       = คำอธิบายสั้น ๆ ที่โชว์ในร้านพ้อย
#
# ── เรตที่ตกลงกันไว้ ──
# 100 บาท = 100 พ้อย  →  กล่อง 100 พ้อย ควรออกเงินเฉลี่ย 1,000,000
# คิดค่าเฉลี่ยแบบนี้: (money ของแต่ละช่อง × weight ของช่องนั้น) รวมกัน ÷ weight รวม
#
# ── กล่องที่ซื้อด้วยพ้อยยังว่างอยู่ ──
# ใส่ของเองเมื่อพร้อม กล่องที่ไม่มี rewards จะขึ้นว่า "ยังไม่ได้ใส่ของ" และซื้อไม่ได้
# จนกว่าจะใส่ ป้องกันคนจ่ายพ้อยแล้วได้กล่องเปล่า
#
# วิธีตั้งกล่องในโลก: ยืนมองบล็อกที่จะทำเป็นกล่อง แล้วพิมพ์ /crate set <ชื่อกล่อง>
# ตั้งแล้วจะมีป้ายลอยขึ้นเหนือบล็อกให้เอง

