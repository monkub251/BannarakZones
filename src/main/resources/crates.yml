# ===== กล่องสุ่ม =====
# weight = น้ำหนักการสุ่ม ยิ่งเลขน้อยยิ่งหายาก (ของที่ weight <= 2 จะประกาศทั้งเซิร์ฟ)
#
# กล่องทุกใบจ่าย "เงินอย่างเดียว" ตามที่ตั้งไว้ — เซิร์ฟไม่แจกไอเทมให้ใคร
# ของทุกชิ้นในเซิร์ฟต้องมาจากการขุดเอง หรือซื้อจากผู้เล่นด้วยกันที่ /market
#
# วิธีตั้งกล่องในโลก: ยืนมองบล็อกที่จะทำเป็นกล่อง แล้วพิมพ์ /crate set <ชื่อกล่อง>
# แจกกุญแจ: /crate key <ชื่อกล่อง> <ชื่อผู้เล่น> [จำนวน]

