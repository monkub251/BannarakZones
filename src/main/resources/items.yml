# ===== ไอเทมของเซิร์ฟ =====
# material  : ไอเทมพื้นฐานในเกมที่เอามาสวมโมเดล
# model-data: เลข custom model data ที่ตรงกับ resource pack ที่ทำจาก Blockbench/Blender
#             (ยังไม่มี pack ก็ใช้ได้ แค่จะเห็นเป็นรูปไอเทมพื้นฐาน)
# stats     : ค่าที่เพิ่มให้ ใส่เฉพาะที่ต้องการ
#   attack-damage / attack-speed      -> ตอนถือในมือ
#   armor / armor-toughness / knockback-resistance -> ตอนใส่เป็นเกราะ
#   max-health / movement-speed       -> ตลอดเวลาที่พกไว้
#
# แจกของ: /citem give <id> <ชื่อผู้เล่น> [จำนวน]
# ดูรายการ: /citem

items:

  bannarak_blade:
