name: BannarakZones
version: ${project.version}
main: com.bannarak.zones.BannarakZones
api-version: '26.3'
authors: [Lord_Bannarak]
description: Beacon-anchored protection zones with upgrades, members and entry effects.
softdepend: [Vault, VaultUnlocked, Essentials]
commands:
  zone:
    permission: zones.command.zone
    description: Zone commands
    aliases: [z, protect, zn]
    usage: /zone
  money:
    permission: zones.command.money
    description: Show a balance
    aliases: [bal, balance, เงิน]
    usage: /money [player]
  pay:
    permission: zones.command.pay
    description: Send money to another player
    usage: /pay <player> <amount>
  baltop:
    permission: zones.command.baltop
    description: Richest players
    aliases: [moneytop, top]
    usage: /baltop
  mission:
    permission: zones.command.mission
    description: Open the mission menu
    aliases: [missions, quest, quests, ภารกิจ]
    usage: /mission
  menu:
    permission: zones.command.menu
    description: Open the server menu
    aliases: [m, hub, เมนู]
    usage: /menu [name]
  admin:
    permission: zones.admin.admin
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Open the staff panel
    usage: /admin [web]
    aliases: [ap, แอดมิน]
  ban:
    permission: zones.admin.ban
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Ban a player
    usage: /ban <player> [time] [reason]
  unban:
    permission: zones.admin.unban
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Lift a ban
    usage: /unban <player>
  mute:
    permission: zones.admin.mute
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Stop a player chatting
    usage: /mute <player> [time] [reason]
  unmute:
    permission: zones.admin.unmute
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Lift a mute
    usage: /unmute <player>
  kick:
    permission: zones.admin.kick
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Kick a player
    usage: /kick <player> [reason]
  warn:
    permission: zones.admin.warn
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Warn a player
    usage: /warn <player> <reason>
  history:
    permission: zones.admin.history
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Punishment history for a player
    usage: /history <player>
  backup:
    permission: zones.admin.backup
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Back up the worlds and plugin data now
    aliases: [สำรอง]
    usage: /backup [list]
  adminhud:
    permission: zones.admin.adminhud
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Toggle the admin sidebar
    aliases: [hud]
  citem:
    permission: zones.admin.citem
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Server-made items
    aliases: [customitem, ไอเทม]
    usage: /citem [list|give]
  market:
    permission: zones.command.market
    description: Browse the player market
    aliases: [ah, ตลาด]
    usage: /market [mine|box]
  sell:
    permission: zones.command.sell
    description: List the item in your hand for sale
    usage: /sell <price>
  crate:
    permission: zones.command.crate
    description: Crates and keys
    aliases: [crates, กล่อง]
    usage: /crate <list|key|set|unset>
  daily:
    permission: zones.command.daily
    description: Daily login reward
    aliases: [รายวัน]
  dungeon:
    permission: zones.command.dungeon
    description: Open the dungeon menu
    aliases: [dg, ดันเจียน]
    usage: /dungeon [setspawn]
  rank:
    permission: zones.command.rank
    description: See the rank ladder
    aliases: [ranks, ยศ]
  shop:
    permission: zones.command.shop
    description: Open the server shop
    aliases: [ร้าน, store]
    usage: /shop [category]
  spawn:
    permission: zones.command.spawn
    description: Go to the server spawn
  points:
    permission: zones.command.points
    description: Your points balance
    aliases: [p, พ้อย, point]
    usage: /points [player] | /points give|take|set <player> <amount> | /points log
  pshop:
    permission: zones.command.pshop
    description: Spend points on cosmetics
    aliases: [ร้านพ้อย, pointshop]
  topup:
    permission: zones.command.topup
    description: How to buy points
    aliases: [เติมเงิน, เติมพ้อย]
  vanish:
    permission: zones.admin.vanish
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Disappear from everyone without staff sight
    aliases: [v, ล่องหน]
  god:
    permission: zones.admin.god
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Toggle invulnerability
    aliases: [อมตะ]
  speed:
    permission: zones.admin.speed
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Set your walk or fly speed
    usage: /speed <0-10>
  nv:
    permission: zones.admin.nv
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Toggle night vision
    aliases: [nightvision]
  invsee:
    permission: zones.admin.invsee
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Look inside a player's inventory
    usage: /invsee <player>
  ec:
    permission: zones.admin.invsee
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Look inside a player's ender chest
    aliases: [enderchest]
    usage: /ec <player>
  head:
    permission: zones.admin.head
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Wear a player's head
    usage: /head <player>
  mining:
    permission: zones.admin.mining
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Mining statistics used to spot x-ray
    aliases: [xray, ขุด]
    usage: /mining [player|reset <player>]
  holo:
    permission: zones.admin.holo
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Floating text and big 3D titles
    aliases: [hologram, holograms, ป้าย, ป้ายลอย]
    usage: /holo <create|title|addline|setline|delline|size|bg|billboard|move|tp|list|delete|reload>
  npc:
    permission: zones.admin.npc
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Create and manage the clickable NPCs at spawn
    aliases: [npcs, เอ็นพีซี]
    usage: /npc <create|cmd|name|type|move|tp|list|delete|reload>
  setspawn:
    permission: zones.admin.setspawn
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Set the server spawn, the first-join point or the death respawn point
    usage: /setspawn [first|death|list] [clear]
  home:
    permission: zones.command.home
    description: Go to one of your homes
    aliases: [h, บ้าน]
    usage: /home [name]
  sethome:
    permission: zones.command.sethome
    description: Save your current spot as a home
    usage: /sethome [name]
  delhome:
    permission: zones.command.delhome
    description: Remove a home
    usage: /delhome <name>
  warp:
    permission: zones.command.warp
    description: Travel to a warp
    aliases: [warps]
    usage: /warp [name]
  setwarp:
    permission: zones.admin.setwarp
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Create a warp
    usage: /setwarp <name> [ICON]
  delwarp:
    permission: zones.admin.delwarp
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Remove a warp
    usage: /delwarp <name>
  tpa:
    permission: zones.command.tpa
    description: Ask to teleport to a player
    usage: /tpa [player]
  tpaccept:
    permission: zones.command.tpaccept
    description: Accept a teleport request
    aliases: [tpyes]
  tpdeny:
    permission: zones.command.tpdeny
    description: Refuse a teleport request
    aliases: [tpno]
  eco:
    permission: zones.admin.eco
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Admin money control
    aliases: [economy]
    usage: /eco <give|take|set> <player> <amount>
  msg:
    permission: zones.command.msg
    description: Send a private message
    usage: /msg <player> <message>
    aliases: [w, tell, whisper, pm]
  r:
    permission: zones.command.r
    description: Reply to the last private message
    usage: /r <message>
    aliases: [reply]
  ignore:
    permission: zones.command.ignore
    description: Stop seeing a player's chat
    usage: /ignore [player]
    aliases: [block]
  chat:
    permission: zones.admin.chat
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: Staff chat controls
    usage: /chat <clear|lock|spy>
  rtp:
    permission: zones.command.rtp
    description: Teleport somewhere random in the wild
    usage: /rtp
    aliases: [wild, สำรวจ]
  world:
    permission: zones.admin.world
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
    description: List worlds, travel between them, set borders
    usage: /world [name|border]
  commands:
    description: Show every command you are allowed to use
    usage: /commands
    permission: zones.command.commands
    aliases: [cmds, คำสั่ง, ช่วย]
  astick:
    description: Get the staff stick that reaches across the map
    usage: /astick
    permission: zones.admin.astick
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
  jail:
    description: Send a player to the cell
    usage: /jail <player> [30m|2h|perm]
    permission: zones.admin.jail
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
  unjail:
    description: Let a player out of the cell
    usage: /unjail <player>
    permission: zones.admin.unjail
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
  setjail:
    description: Put the cell where you are standing
    usage: /setjail
    permission: zones.admin.setjail
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
  spectate:
    description: Watch through a player's eyes
    usage: /spectate <player>
    permission: zones.admin.spectate
    permission-message: "&cคำสั่งนี้สำหรับทีมงานเท่านั้น"
permissions:
  zones.use:
    description: Base access to the plugin
    default: true

  # ───── คำสั่งของผู้เล่นทั่วไป เปิดให้ทุกคนโดยปริยาย ─────
  zones.player:
    description: Every command an ordinary player may use
    default: true
    children:
      zones.command.commands: true
      zones.command.zone: true
      zones.command.money: true
      zones.command.pay: true
      zones.command.baltop: true
      zones.command.mission: true
      zones.command.menu: true
      zones.command.market: true
      zones.command.sell: true
      zones.command.crate: true
      zones.command.daily: true
      zones.command.dungeon: true
      zones.command.rank: true
      zones.command.shop: true
      zones.command.points: true
      zones.command.pshop: true
      zones.command.topup: true
      zones.command.spawn: true
      zones.command.home: true
      zones.command.sethome: true
      zones.command.delhome: true
      zones.command.warp: true
      zones.command.tpa: true
      zones.command.tpaccept: true
      zones.command.tpdeny: true
      zones.command.msg: true
      zones.command.r: true
      zones.command.ignore: true
      zones.command.rtp: true

  # ───── คำสั่งทีมงาน ปิดไว้ ให้เฉพาะ op หรือยศที่ตั้งสิทธิ์ ─────
  zones.admin:
    description: Full staff access, grants every staff command below
    default: op
    children:
      zones.admin.admin: true
      zones.admin.ban: true
      zones.admin.unban: true
      zones.admin.mute: true
      zones.admin.unmute: true
      zones.admin.kick: true
      zones.admin.warn: true
      zones.admin.history: true
      zones.admin.backup: true
      zones.admin.adminhud: true
      zones.admin.citem: true
      zones.admin.eco: true
      zones.admin.vanish: true
      zones.admin.vanish.see: true
      zones.admin.god: true
      zones.admin.speed: true
      zones.admin.nv: true
      zones.admin.invsee: true
      zones.admin.head: true
      zones.admin.mining: true
      zones.admin.points: true
      zones.admin.blocks: true
      zones.admin.holo: true
      zones.admin.npc: true
      zones.admin.setspawn: true
      zones.admin.setwarp: true
      zones.admin.delwarp: true
      zones.admin.chat: true
      zones.admin.world: true
      zones.admin.astick: true
      zones.admin.jail: true
      zones.admin.unjail: true
      zones.admin.setjail: true
      zones.admin.spectate: true

  # ───── สิทธิ์พิเศษอื่น ─────
  zones.chat.bypass:
    description: Ignore the chat cooldown, repeat check and word filter
    default: op
  zones.chat.link:
    description: Allowed to post links in chat
    default: op
