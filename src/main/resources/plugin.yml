name: BannarakZones
version: ${project.version}
main: com.bannarak.zones.BannarakZones
api-version: '26.3'
authors: [Lord_Bannarak]
description: Beacon-anchored protection zones with upgrades, members and entry effects.
softdepend: [Vault, VaultUnlocked, Essentials]
commands:
  zone:
    description: Zone commands
    aliases: [z, protect, zn]
    usage: /zone
  money:
    description: Show a balance
    aliases: [bal, balance, เงิน]
    usage: /money [player]
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
  baltop:
    description: Richest players
    aliases: [moneytop, top]
    usage: /baltop
  mission:
    description: Open the mission menu
    aliases: [missions, quest, quests, ภารกิจ]
    usage: /mission
  eco:
    description: Admin money control
    aliases: [economy]
    usage: /eco <give|take|set> <player> <amount>
permissions:
  zones.use:
    default: true
  zones.admin:
    default: op
