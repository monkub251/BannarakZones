name: BannarakZones
version: ${project.version}
main: com.bannarak.zones.BannarakZones
api-version: '26.3'
authors: [Lord_Bannarak]
description: Beacon-anchored protection zones with upgrades, members and entry effects.
softdepend: [Vault, VaultUnlocked, Essentials]
commands:
  zone:
    description: Zone commands
    aliases: [z, protect, zn]
    usage: /zone
  money:
    description: Show a balance
    aliases: [bal, balance, เงิน]
    usage: /money [player]
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
  baltop:
    description: Richest players
    aliases: [moneytop, top]
    usage: /baltop
  mission:
    description: Open the mission menu
    aliases: [missions, quest, quests, ภารกิจ]
    usage: /mission
  menu:
    description: Open the server menu
    aliases: [m, hub, เมนู]
    usage: /menu [name]
  admin:
    description: Open the staff panel
    usage: /admin [web]
    aliases: [ap, แอดมิน]
  ban:
    description: Ban a player
    usage: /ban <player> [time] [reason]
  unban:
    description: Lift a ban
    usage: /unban <player>
  mute:
    description: Stop a player chatting
    usage: /mute <player> [time] [reason]
  unmute:
    description: Lift a mute
    usage: /unmute <player>
  kick:
    description: Kick a player
    usage: /kick <player> [reason]
  warn:
    description: Warn a player
    usage: /warn <player> <reason>
  history:
    description: Punishment history for a player
    usage: /history <player>
  backup:
    description: Back up the worlds and plugin data now
    aliases: [สำรอง]
    usage: /backup [list]
  adminhud:
    description: Toggle the admin sidebar
    aliases: [hud]
  citem:
    description: Server-made items
    aliases: [customitem, ไอเทม]
    usage: /citem [list|give]
  market:
    description: Browse the player market
    aliases: [ah, ตลาด]
    usage: /market [mine|box]
  sell:
    description: List the item in your hand for sale
    usage: /sell <price>
  crate:
    description: Crates and keys
    aliases: [crates, กล่อง]
    usage: /crate <list|key|set|unset>
  daily:
    description: Daily login reward
    aliases: [รายวัน]
  dungeon:
    description: Open the dungeon menu
    aliases: [dg, ดันเจียน]
    usage: /dungeon [setspawn]
  rank:
    description: See the rank ladder
    aliases: [ranks, ยศ]
  shop:
    description: Open the server shop
    aliases: [ร้าน, store]
    usage: /shop [category]
  spawn:
    description: Go to the server spawn
  setspawn:
    description: Set the server spawn
  home:
    description: Go to one of your homes
    aliases: [h, บ้าน]
    usage: /home [name]
  sethome:
    description: Save your current spot as a home
    usage: /sethome [name]
  delhome:
    description: Remove a home
    usage: /delhome <name>
  warp:
    description: Travel to a warp
    aliases: [warps]
    usage: /warp [name]
  setwarp:
    description: Create a warp
    usage: /setwarp <name> [ICON]
  delwarp:
    description: Remove a warp
    usage: /delwarp <name>
  tpa:
    description: Ask to teleport to a player
    usage: /tpa [player]
  tpaccept:
    description: Accept a teleport request
    aliases: [tpyes]
  tpdeny:
    description: Refuse a teleport request
    aliases: [tpno]
  eco:
    description: Admin money control
    aliases: [economy]
    usage: /eco <give|take|set> <player> <amount>
permissions:
  zones.use:
    default: true
  zones.admin:
    default: op
