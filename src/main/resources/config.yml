# ===== BannarakZones =====
# แก้ค่าแล้วพิมพ์ /zone reload ในเกม ไม่ต้องรีสตาร์ทเซิร์ฟ

zone:
  # บล็อกจับจองต้องเป็น "บล็อกจับจอง" ที่มีชื่อเท่านั้น
  # บีคอนธรรมดาที่ซื้อหรือคราฟต์เองจะเป็นบีคอนธรรมดา ใช้ตกแต่งได้
  # ปิดเป็น false ถ้าอยากให้บีคอนทุกอันจับจองได้เหมือนเดิม
  require-tagged-block: true
  # ───── บล็อกป้องกันของทีมงาน ─────
  # วางบล็อกนี้ = สร้างเขตทีมงานทันที ไม่เสียเงิน ไม่กินช่อง
  # คนธรรมดาแตะอะไรในเขตนี้ไม่ได้เลย แม้จะเป็นสมาชิกเขตก็ตาม
  # ทุบบล็อกเพื่อลบเขต (เฉพาะทีมงาน)
  admin-block: REINFORCED_DEEPSLATE
  admin-radius: 64
  # บล็อกที่วางแล้วเกิดเขต
  block: BEACON
  # รัศมีเริ่มต้น (16 = พื้นที่ 32x32)
  default-radius: 16
  # รัศมีสูงสุดที่อัปได้
  max-radius: 48
  # ความสูงของเขตสำหรับ "คนนอก" — full = เต็มความสูงโลก กันขุดจากข้างบน/ข้างล่าง
  outsider-vertical: full
  # ระยะแนวตั้งที่เจ้าของใช้งานได้ (ใช้เมื่อ outsider-vertical ไม่ใช่ full)
  vertical-range: 32
  # เขตแรกฟรี
  first-zone-free: true
  # เว้นระยะห่างขั้นต่ำระหว่างเขตของคนละคน (บล็อก)
  min-gap: 4
  # โลกที่ห้ามสร้างเขต
  blocked-worlds:
    - lobby

upgrades:
  # ราคาขยายรัศมี: รัศมีปลายทาง -> ราคา
  radius:
    24: 10000
    32: 30000
    48: 80000
  slots:
    # ราคาเขตที่ 2 แล้วคูณต่อไปเรื่อย ๆ
    base-price: 20000
    multiplier: 2.0

economy:
  # เซิร์ฟขายของให้ผู้เล่นไหม — ปิดไว้ ของทุกชิ้นต้องขุดเองหรือซื้อจากผู้เล่นที่ /market
  # เปิดเป็น true เมื่อไหร่ ราคา buy: ใน shop.yml ถึงจะถูกใช้
  server-sells-items: false
  # ชื่อสกุลเงินและสัญลักษณ์หน้าตัวเลข
  currency-name: "เหรียญ"
  currency-symbol: "₡"
  # เงินที่คนใหม่ได้ตอนเข้าเซิร์ฟครั้งแรก
  starting-balance: 1000
  # โอนขั้นต่ำต่อครั้ง
  pay-minimum: 1
  # ยกเงินของเราให้ปลั๊กอินอื่นใช้ผ่าน Vault
  register-with-vault: true

menu:
  # แจกไอเทมเปิดเมนูให้ทุกคน คลิกขวาแล้วเปิดเมนูหลักเลย ไม่ต้องพิมพ์คำสั่ง
  # ทิ้งไม่ได้ เอาเข้าหีบไม่ได้ ตายแล้วไม่หาย ถ้าหายจะได้คืนตอนเข้าเกม
  give-item: true
  item: NETHER_STAR          # เปลี่ยนเป็นไอเทมอะไรก็ได้
  item-name: "<gold><bold>เมนูเซิร์ฟ"
  item-slot: 8               # ช่องที่เท่าไหร่ในแถบล่าง (0-8, 8 = ขวาสุด)
  item-lore:
    - "<yellow>คลิกขวาเพื่อเปิด"
    - "<gray>รวมทุกอย่างไว้ในนี้"
  # คลิกขวาเข็มทิศเปิดเมนูด้วย (ของเดิม ปิดไว้)
  compass-item: false

spawn:
  # จุดเกิดของเซิร์ฟ (ใช้เมื่อยังไม่เคย /setspawn)
  world: lobby
  x: 0.5
  y: 100
  z: 0.5
  yaw: 0
  pitch: 0
  # พาคนเข้าเซิร์ฟครั้งแรกมาที่จุดเกิด
  # ตั้งจุดแยกได้ด้วย /setspawn first (ถ้าไม่ตั้ง จะใช้จุดเกิดหลัก)
  teleport-on-first-join: true
  # ตายแล้วเกิดที่จุดเกิดเสมอ (ถ้าไม่ได้นอนเตียงไว้)
  # ตั้งจุดแยกได้ด้วย /setspawn death (ถ้าไม่ตั้ง จะใช้จุดเกิดหลัก)
  respawn-at-spawn: false

homes:
  # จำนวนบ้านพื้นฐานของทุกคน
  default-limit: 1
  # เพิ่มให้ยศสูงด้วยสิทธิ์ zones.homes.<เลข> เช่น zones.homes.5
  permission-ceiling: 20

teleport:
  # นับถอยหลังก่อนวาร์ป ขยับตัวแล้วยกเลิก (0 = วาร์ปทันที)
  warmup-seconds: 3
  # คำขอวาร์ปหมดอายุในกี่วินาที
  request-seconds: 60

punish:
  # ประกาศทั้งเซิร์ฟเมื่อมีคนโดนแบน/ปิดปาก/เตะ
  broadcast: true
  # ข้อความท้ายหน้าจอแบน
  appeal: "ติดต่อทีมงานใน Discord"

backup:
  # ปิดได้ แต่ไม่แนะนำ
  enabled: true
  # สำรองทุกกี่ชั่วโมง
  every-hours: 6
  # เก็บไฟล์ล่าสุดไว้กี่ไฟล์ เกินกว่านี้ลบตัวเก่าสุดทิ้ง
  keep: 10
  # โฟลเดอร์ปลายทาง (ใส่ path เต็มก็ได้ เช่น D:/mcbackup)
  folder: backups
  # สำรองไฟล์ตั้งค่าและข้อมูลของปลั๊กอินด้วย
  include-plugin-data: true
  # บอกคนในเซิร์ฟตอนเริ่มสำรอง
  announce: true
  # ระดับการบีบอัด 0-9 (เลขมาก = ไฟล์เล็กแต่ช้า)
  compression: 4

admin-hud:
  # หัวข้อบนแผงข้างจอของแอดมิน
  title: "<gold>ผู้ดูแล"
  # รีเฟรชทุกกี่ tick (40 = 2 วินาที)
  refresh-ticks: 40

market:
  # ค่าธรรมเนียมที่หักจากผู้ขาย (เปอร์เซ็นต์)
  tax-percent: 5
  # วางขายได้สูงสุดกี่รายการต่อคน
  listings-per-player: 5
  # ราคาขั้นต่ำต่อรายการ
  min-price: 1
  # ของที่ขายไม่ออกภายในกี่วันจะเด้งเข้ากล่องเก็บของคืน (0 = ไม่หมดอายุ)
  expire-days: 7
  # ประกาศทั้งเซิร์ฟทุกครั้งที่มีคนวางขาย
  broadcast-listings: false

crates:
  # ประกาศทั้งเซิร์ฟเมื่อมีคนสุ่มได้ของหายาก
  broadcast-rare: true

daily:
  # เตือนตอนเข้าเซิร์ฟว่ายังไม่ได้รับ
  remind-on-join: true
  days:
    1: { money: 5000 }
    2: { money: 8000 }
    3: { money: 12000 }
    4: { money: 18000 }
    5: { money: 25000 }
    6: { money: 35000 }
    7:
      money: 80000
      commands:
        - "crate key common <player> 1"

dungeon:
  # โลกและจุดเริ่ม — ยืนตรงที่ต้องการแล้วพิมพ์ /dungeon setspawn
  world: dungeon
  spawn:
    x: 0.5
    y: 64
    z: 0.5
    yaw: 0
    pitch: 0
  # จำนวนเวฟทั้งหมด เวฟรองสุดท้าย = บอสรอง เวฟสุดท้าย = บอสใหญ่
  waves: 50
  party:
    min: 3
    max: 5
  # เวลานับถอยหลังให้เตรียมของก่อนเริ่ม
  countdown-seconds: 10
  wave-break-seconds: 6
  # ระยะที่มอบเกิดรอบจุดกลาง
  spawn-radius: 12
  # ลงได้อีกครั้งหลังผ่านไปกี่ชั่วโมง
  cooldown-hours: 10

  scaling:
    health-per-wave: 0.06
    damage-per-wave: 0.04

  mobs:
    base: 4
    per-wave: 0.55
    per-player: 1.2

  # มอบที่ออกในแต่ละช่วงเวฟ
  pools:
    early:
      waves: "1-10"
      mobs: [ZOMBIE, SKELETON]
    mid:
      waves: "11-22"
      mobs: [ZOMBIE, SKELETON, SPIDER, HUSK, STRAY]
    deep:
      waves: "23-35"
      mobs: [ZOMBIE, SKELETON, CREEPER, WITCH, CAVE_SPIDER, DROWNED]
    abyss:
      waves: "36-48"
      mobs: [WITHER_SKELETON, BLAZE, PIGLIN_BRUTE, RAVAGER, EVOKER, VINDICATOR]

  miniboss:
    type: RAVAGER
    name: "<red>ผู้เฝ้าประตู"
    health: 600
    damage: 10

  boss:
    type: WITHER
    name: "<dark_red>เจ้าแห่งเหวลึก"
    health: 1400
    damage: 16

  rewards:
    # เงินต่อเวฟ คูณขึ้นเรื่อย ๆ ตามเวฟ
    per-wave: 2000
    wave-multiplier: 1.08
    # เงินก้อนตอนผ่านครบ
    clear: 500000
    # คำสั่งแถมตอนผ่าน ใช้ <player> แทนชื่อคน
    clear-commands: []

ranks:
  # ใส่ชื่อยศหน้าชื่อในแชท
  format-chat: true
  chat-format: "<prefix><white><player><gray>: <white><message>"
  # ประกาศทั้งเซิร์ฟเมื่อมีคนเลื่อนยศ
  broadcast: true

missions:
  # เด้งตัวหนังสือกลางจอตอนผ่านขั้น (false = ใช้แถบเหนือช่องไอเทมแทน)
  popup: true
  # ประกาศทั้งเซิร์ฟเมื่อมีคนทำภารกิจครบทุกขั้น
  broadcast-final: true
  # ตรวจความคืบหน้าทุกกี่ tick (100 = 5 วินาที)
  check-interval-ticks: 100

notify:
  # เปิด/ปิดเสียงประกอบการแจ้งเตือนทั้งหมด
  sound: true

protection:
  # ───── โลกที่ล็อกไว้ทั้งโลก ─────
  # คนธรรมดาจะวาง ทุบ เปิดหีบ จุดไฟ อะไรไม่ได้เลยในโลกนี้
  # ระเบิดกับไฟลามก็ไม่กินบล็อก ทีมงานทำได้ตามปกติ
  # สลับในเกมได้ด้วย /zone lockworld [ชื่อโลก]
  locked-worlds:
    - lobby
  block-break: true
  block-place: true
  containers: true
  pvp: true
  explosions: true
  fire: true
  buckets: true
  entities: true
  pistons: true

effects:
  enter: "<green>▶ <white>เข้าเขตของ <yellow><owner>"
  leave: "<gray>◀ <white>ออกจากเขตของ <yellow><owner>"
  enter-own: "<green>▶ <white>กลับเข้าเขตของคุณ"
  leave-own: "<gray>◀ <white>ออกจากเขตของคุณ"
  sound-enter: "block.note_block.pling"
  sound-leave: "block.note_block.bass"
  sound-volume: 0.7
  sound-pitch-enter: 1.6
  sound-pitch-leave: 0.8
  # แสดงขอบเขตด้วยอนุภาคตอนสร้าง/อัปเกรด
  show-border: true
  # จำนวนจังหวะที่กะพริบก่อนจางหาย (มากขึ้น = อยู่นานขึ้น)
  border-pulses: 12
  # ห่างกันกี่ tick ต่อจังหวะ (20 tick = 1 วินาที)
  border-period-ticks: 7

messages:
  prefix: "<gold>[เขต] <reset>"
  created: "<green>สร้างเขตเรียบร้อย รัศมี <yellow><radius> <green>บล็อก"
  removed: "<yellow>ลบเขตแล้ว"
  no-slots: "<red>เขตเต็มแล้ว ซื้อช่องเพิ่มที่เมนูบีคอน (<yellow><price> <red>เหรียญ)"
  overlap: "<red>ตรงนี้ชนกับเขตของคนอื่น หาที่ใหม่"
  blocked-world: "<red>สร้างเขตในโลกนี้ไม่ได้"
  deny-build: "<red>ที่นี่เป็นเขตของ <yellow><owner>"
  deny-container: "<red>หีบนี้อยู่ในเขตของ <yellow><owner>"
  deny-pvp: "<red>ตีกันในเขตไม่ได้"
  not-owner: "<red>คุณไม่ใช่เจ้าของเขตนี้"
  no-money: "<red>เงินไม่พอ ต้องมี <yellow><price> <red>เหรียญ"
  upgraded: "<green>ขยายเขตเป็นรัศมี <yellow><radius> <green>แล้ว"
  slot-bought: "<green>ซื้อช่องเขตเพิ่มแล้ว ตอนนี้มี <yellow><slots> <green>ช่อง"
  max-radius: "<yellow>เขตนี้ขยายสุดแล้ว"
  no-economy: "<red>ระบบเงินยังไม่พร้อม ติดต่อแอดมิน"
  member-added: "<green>เพิ่ม <yellow><player> <green>เข้าเขตแล้ว"
  member-removed: "<yellow>เอา <white><player> <yellow>ออกจากเขตแล้ว"
  reloaded: "<green>โหลดค่าใหม่แล้ว"

# ─────────────────────────────────────────────────────────────
# แผงควบคุมหน้าเว็บ (เข้าจากที่ไหนก็ได้ผ่านเบราว์เซอร์)
#
# ขอรหัสเข้าใช้งานในเกมด้วย  /admin web
# รหัสใช้ได้ครั้งเดียว และหมดอายุตาม code-minutes
#
# คำเตือน: หน้านี้เป็น HTTP ธรรมดา ยังไม่ได้เข้ารหัส
#   - เปิดในวงเน็ตที่ไว้ใจได้ หรือ
#   - ต่อผ่านอุโมงค์ที่เติม HTTPS ให้ (เช่น Cloudflare Tunnel)
#     แล้วใส่ที่อยู่จริงใน public-url เพื่อให้คำสั่งในเกมบอกลิงก์ถูก
# ─────────────────────────────────────────────────────────────
web:
  enabled: false          # เปลี่ยนเป็น true เพื่อเปิดใช้
  port: 8765              # ต้องเปิดพอร์ตนี้ที่เราเตอร์ถ้าจะเข้าจากข้างนอก
  bind: "0.0.0.0"         # 127.0.0.1 = เข้าได้จากเครื่องเซิร์ฟเท่านั้น
  public-url: ""          # เช่น "https://panel.bannarakx.net" (ว่างไว้ = เดาจากพอร์ต)
  code-minutes: 5         # รหัสหมดอายุในกี่นาที
  session-hours: 2        # ล็อกอินค้างได้กี่ชั่วโมง
  bot-token: ""           # รหัสลับให้บอทดิสคอร์ดยิงเข้า /api/discord/* (ว่าง = ปิด)
  max-attempts: 5         # กรอกผิดได้กี่ครั้งก่อนโดนล็อก
  lock-minutes: 10        # โดนล็อกนานกี่นาที

# ─────────────────────────────────────────────────────────────
# แชต: ข้อความส่วนตัว, บล็อกคน, กรองคำ, กันสแปม, TAB
# ─────────────────────────────────────────────────────────────
chat:
  join-messages: true       # แสดงข้อความคนเข้า-ออก
  tab-list: true            # ใส่ยศหน้าชื่อในหน้า TAB และใส่หัว-ท้าย
  cooldown-ms: 1200         # พิมพ์ติดกันได้เร็วสุดกี่มิลลิวินาที
  block-repeats: true       # ห้ามพูดประโยคเดิมซ้ำติดกัน
  block-links: true         # ห้ามส่งลิงก์ (ยกเว้นคนที่มีสิทธิ์ zones.chat.link)

  # คำที่ห้ามพูด — ระบบจะตัดช่องว่างและจุดออกก่อนเทียบ
  # เลยจับ "โ ก ง" หรือ "โ.ก.ง" ได้ด้วย เพิ่มได้ตามใจ
  blocked-words:
    - "ควย"
    - "เหี้ย"
    - "สัส"
    - "ไอ้สัตว์"

  tab-header:
    - ""
    - "<gradient:#f0cf8a:#b8863a><bold>BANNARAKX</bold></gradient>"
    - "<gray>ออนไลน์ <white><online><gray>/<white><max>"
    - ""
  tab-footer:
    - ""
    - "<gray>เงินของคุณ <gold><money>"
    - "<dark_gray>bannarakx</dark_gray>"
    - ""

  # ข้อความต่าง ๆ — <player> <from> <to> <message> ใช้แทนค่าได้
  first-join: "<gold>✦ <white><player> <gray>เข้าเซิร์ฟครั้งแรก ต้อนรับหน่อย!"
  join: "<dark_gray>[<green>+<dark_gray>] <gray><player>"
  quit: "<dark_gray>[<red>-<dark_gray>] <gray><player>"
  whisper-out: "<dark_gray>[<gray>คุณ <dark_gray>→ <gray><to><dark_gray>] <white><message>"
  whisper-in: "<dark_gray>[<gray><from> <dark_gray>→ <gray>คุณ<dark_gray>] <white><message>"
  locked: "<red>แชตถูกล็อกอยู่ ทีมงานกำลังคุยกัน"
  too-fast: "<red>พิมพ์ช้าลงหน่อย"
  repeat: "<red>พูดซ้ำเดิมไม่ได้"
  no-links: "<red>ส่งลิงก์ในแชตไม่ได้"
  filtered: "<red>คำนี้ใช้ในแชตไม่ได้"

# ─────────────────────────────────────────────────────────────
# โลก: สร้างโลกเพิ่ม, ขอบโลก, สุ่มวาร์ปออกไปสำรวจ
# ─────────────────────────────────────────────────────────────
worlds:

  # โลกที่จะสร้างให้ตอนเปิดเซิร์ฟ ถ้ายังไม่มี
  # type: void (ฟ้าโล่ง) / flat / normal / nether / end
  create:
    lobby:
      type: void
      seed: ""
      starter-platform: true    # วางแท่นชั่วคราวให้ยืน จะรื้อทีหลังตอนสร้างล็อบบี้จริง
      platform-block: SMOOTH_STONE
      platform-x: 0
      platform-y: 99
      platform-z: 0
      # ชื่อ gamerule ของ 26.x — ชื่อเก่า (doDaylightCycle ฯลฯ) ก็ยังใส่ได้ ปลั๊กอินแปลงให้เอง
      gamerules:
        - "SPAWN_MOBS=false"
        - "ADVANCE_TIME=false"
        - "ADVANCE_WEATHER=false"
        - "KEEP_INVENTORY=true"
        - "FALL_DAMAGE=false"
        - "FIRE_SPREAD_RADIUS_AROUND_PLAYER=0"

  # ขอบโลก — รัศมีเป็นบล็อกจากจุดกลาง, 0 = ไม่จำกัด
  # ตั้งในเกมได้ด้วย /world border <ชื่อ> <รัศมี>
  border:
    world:
      x: 0
      z: 0
      radius: 10000
    lobby:
      x: 0
      z: 0
      radius: 200

  # สุ่มวาร์ปออกไปสำรวจ (/rtp)
  rtp:
    world: "world"            # สุ่มลงในโลกไหน
    min-distance: 300         # ห่างจากจุดกลางอย่างน้อยกี่บล็อก
    max-distance: 4000        # ไกลสุดกี่บล็อก (ควรน้อยกว่ารัศมีขอบโลก)
    cooldown-seconds: 300     # รอกี่วินาทีจึงสุ่มได้อีก
    price: 0                  # ค่าใช้บริการ (0 = ฟรี)
    attempts: 40              # ลองหาที่ลงกี่ครั้งก่อนยอมแพ้


# ─────────────────────────────────────────────────────────────
# แถบข้อมูลข้างจอ ที่ผู้เล่นทุกคนเห็นตลอดเวลา
# ใช้แทนค่าได้: <player> <rank> <money> <online> <max> <world> <zones>
# ─────────────────────────────────────────────────────────────
hud:
  enabled: true
  refresh-ticks: 20
  title: "<gradient:#f0cf8a:#b8863a><bold>BANNARAKX</bold></gradient>"
  # เอาแต่ข้อมูลสำคัญ ไม่มีเส้นคั่น ไม่มีชื่อตัวเอง (ผู้เล่นรู้อยู่แล้ว)
  # ตัวแปรที่ใช้ได้: <player> <rank> <money> <points> <here> <online> <max> <world> <zones> <tip>
  lines:
    - "<gray>ยศ <yellow><rank>"
    - "<gray>เงิน <gold><money>"
    - "<gray>พ้อย <yellow><points> P"
    - "<gray>ที่นี่ <white><here>"
    - "<gray>ออนไลน์ <white><online><dark_gray>/<gray><max>"
  # ถ้าอยากให้สอนคำสั่งไปด้วย เพิ่ม "<tip>" เข้าไปใน lines
  tip-seconds: 6
  tips:
    - "<yellow>/menu <gray>เมนูคำสั่ง"
    - "<yellow>/rtp <gray>สุ่มพื้นที่"
    - "<yellow>/market <gray>ตลาดผู้เล่น"
    - "<yellow>/mission <gray>ภารกิจ"
    - "<yellow>/daily <gray>รางวัลรายวัน"
    - "<yellow>/pshop <gray>ร้านพ้อย"

# ─────────────────────────────────────────────────────────────
# เครื่องมือทีมงาน
# ─────────────────────────────────────────────────────────────
admin-tools:
  stick-reach: 200           # ไม้ทีมงานเอื้อมได้กี่บล็อก
  stick-damage: 6            # ตีหนึ่งทีกี่หน่วย (คลิกซ้ายธรรมดา)
  jail-radius: 12            # ออกห่างจากจุดห้องขังได้กี่บล็อก

# ─────────────────────────────────────────────────────────────
# ยศผูกกับ Discord — ไม่มีการไต่ยศหรือซื้อยศในเกมแล้ว
# ผู้เล่นพิมพ์ /rank เพื่อขอรหัสผูกบัญชี แล้วบอทเอารหัสไปยืนยัน
# รายละเอียดยศแต่ละขั้นและ role id อยู่ใน ranks.yml
# ─────────────────────────────────────────────────────────────
discord:
  enabled: true
  code-minutes: 10           # รหัสผูกบัญชีหมดอายุในกี่นาที
  invite: ""                 # ลิงก์เชิญเข้าดิสคอร์ด โชว์ตอนพิมพ์ /rank

# เครื่องมือทีมงาน
staff:
  # ตอนล่องหน/เลิกล่องหน ให้ขึ้นข้อความเข้า-ออกเกมหลอก คนเล่นจะได้ไม่รู้ว่ามีคนดูอยู่
  fake-join-quit: true
  # ล่องหนแล้วเก็บของไม่ได้ (กันเผลอเก็บของคนอื่น)
  vanish-blocks-pickup: true

# ตรวจจับการขุดผิดปกติ (x-ray)
#
# หมายเหตุสำคัญ: เซิร์ฟเวอร์มองจอคนเล่นไม่ได้ ระบบนี้ดูจาก "ตัวเลข" อย่างเดียว
# คือขุดหินกี่ก้อนกว่าจะเจอแร่ และแร่นั้นถูกปิดมิดทุกด้านจนขุดถึงหรือเปล่า
# คะแนนที่ได้ไม่ใช่คำตัดสิน ให้ใช้เป็นเหตุผลไปส่องเขาขุดจริงก่อนตัดสินใจ
anticheat:
  enabled: true
  # ต้องขุดหินอย่างน้อยเท่านี้ก่อน ถึงจะเริ่มคิดคะแนน (กันตัดสินจากตัวอย่างน้อยเกินไป)
  min-samples: 500
  # ขุดหินกี่ก้อนต่อแร่ 1 ก้อน ถ้า "ต่ำกว่า" ค่านี้ถือว่าผิดปกติ
  # ค่าพวกนี้ควรปรับตามเซิร์ฟตัวเอง ดูจาก /mining ของคนที่ไว้ใจได้ก่อน
  ratio-warn:
    DIAMOND_ORE: 200
    DEEPSLATE_DIAMOND_ORE: 200
    ANCIENT_DEBRIS: 300
    EMERALD_ORE: 400
  # สัดส่วนแร่ที่ถูกปิดมิดจนขุดถึง ถ้าเกิน % นี้ถือว่าผิดปกติ
  blind-find-percent: 60
  # เตือนทีมงานในแชตเมื่อคะแนนถึงเท่านี้ (เตือนคนละไม่เกิน 1 ครั้งต่อ 10 นาที)
  alert-at: 60
  alert-staff: true

# ─────────────────────────────────────────────────────────────
# พ้อย — สกุลเงินที่ซื้อด้วยเงินจริงบนเว็บ
# ─────────────────────────────────────────────────────────────
#
# พ้อยซื้อได้แต่ "ของตกแต่ง" เท่านั้น ห้ามซื้อเงินในเกม ไอเทม หรือสิทธิ์ใด ๆ
# เหตุผลสองข้อ:
#   1. กฎของ Mojang ห้ามขายสิ่งที่ทำให้ได้เปรียบในการแข่งขัน
#   2. เศรษฐกิจเซิร์ฟนี้ให้ของมาจากผู้เล่นด้วยกัน ถ้าเติมเงินแล้วข้ามขั้นได้ ระบบพัง
#
# เว็บเติมพ้อยด้วยการยิง POST /api/points/add
#   header X-Bot-Token: <web.bot-token>
#   body   {"player":"ชื่อในเกม","points":1000,"reference":"รหัสรายการจ่ายเงิน"}
# reference ซ้ำจะถูกปฏิเสธ (กัน webhook ยิงซ้ำแล้วได้พ้อยสองรอบ)
points:
  topup-url: ""              # ลิงก์หน้าเติมเงิน แสดงตอนพิมพ์ /topup

cosmetics:
  # สีชื่อ — tag ใส่เป็น MiniMessage
  colours:
    gold:
      display: "สีทอง"
      tag: "<gold>"
      icon: GOLD_INGOT
      price: 500
    aqua:
      display: "สีฟ้า"
      tag: "<aqua>"
      icon: DIAMOND
      price: 500
    pink:
      display: "สีชมพู"
      tag: "<light_purple>"
      icon: PINK_DYE
      price: 500
    rainbow:
      display: "ไล่สีรุ้ง"
      tag: "<gradient:#ff5555:#ffff55:#55ff55:#55ffff:#ff55ff>"
      icon: NETHER_STAR
      price: 3000

  # สัตว์เลี้ยง — เดินตามอย่างเดียว ตีไม่ได้ โดนตีไม่ได้ ไม่ดรอปอะไร
  # entity ใส่ชื่อ EntityType ของมายคราฟ
  pets:
    cat:
      display: "<yellow>แมว"
      entity: CAT
      icon: COD
      name: "<yellow>แมวของ <owner>"
      price: 1500
    allay:
      display: "<aqua>อัลเลย์"
      entity: ALLAY
      icon: AMETHYST_SHARD
      name: "<aqua>อัลเลย์ของ <owner>"
      price: 2500
    fox:
      display: "<gold>จิ้งจอก"
      entity: FOX
      icon: SWEET_BERRIES
      name: "<gold>จิ้งจอกของ <owner>"
      price: 2000

  # หมวดอื่น ๆ — ซื้อแล้วรันคำสั่งที่ใส่ไว้ ใช้ %player% แทนชื่อคนซื้อ
  # นำหน้าด้วย console: ถ้าอยากให้เซิร์ฟเป็นคนสั่ง
  # ตัวอย่างสกินยังว่างไว้ ต้องเช็กรูปแบบคำสั่งของ SkinsRestorer ก่อนใส่
  extras: {}

# ===== รีสตาร์ตอัตโนมัติ =====
# Paper กินแรมขึ้นเรื่อย ๆ เมื่อเปิดไว้นานหลายวัน รีวันละครั้งตอนดึกช่วยได้มาก
# ต้องมีตัวเปิดเซิร์ฟใหม่ให้ด้วย (systemd บน VPS ทำให้แล้ว)
# ถ้าเปิดไว้บนเครื่องที่ไม่มีตัวเปิดใหม่ เซิร์ฟจะปิดแล้วไม่กลับมา
restart:
  enabled: false
  at: "04:00"
  warn-seconds: [300, 120, 60, 30, 10, 5, 4, 3, 2, 1]

# ===== หน้าต่างพิมพ์ในเมนู =====
# anvil: true  = กดพิมพ์แล้วเปิดหน้าต่างทั่งในเกม (ไม่ต้องออกไปพิมพ์ในแชต)
# ถ้ามือถือผ่าน Geyser เปิดหน้าต่างนี้ไม่ได้ ตั้งเป็น false
# แล้วทุกที่จะเปลี่ยนไปถามในแชตแทน ใช้ได้เหมือนกันทั้ง Java และ Bedrock
input:
  anvil: true
