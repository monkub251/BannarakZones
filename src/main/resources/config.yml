# ===== BannarakZones =====
# แก้ค่าแล้วพิมพ์ /zone reload ในเกม ไม่ต้องรีสตาร์ทเซิร์ฟ

zone:
  # บล็อกที่วางแล้วเกิดเขต
  block: BEACON
  # รัศมีเริ่มต้น (16 = พื้นที่ 32x32)
  default-radius: 16
  # รัศมีสูงสุดที่อัปได้
  max-radius: 48
  # ความสูงของเขตสำหรับ "คนนอก" — full = เต็มความสูงโลก กันขุดจากข้างบน/ข้างล่าง
  outsider-vertical: full
  # ระยะแนวตั้งที่เจ้าของใช้งานได้ (ใช้เมื่อ outsider-vertical ไม่ใช่ full)
  vertical-range: 32
  # เขตแรกฟรี
  first-zone-free: true
  # เว้นระยะห่างขั้นต่ำระหว่างเขตของคนละคน (บล็อก)
  min-gap: 4
  # โลกที่ห้ามสร้างเขต
  blocked-worlds:
    - lobby

upgrades:
  # ราคาขยายรัศมี: รัศมีปลายทาง -> ราคา
  radius:
    24: 10000
    32: 30000
    48: 80000
  slots:
    # ราคาเขตที่ 2 แล้วคูณต่อไปเรื่อย ๆ
    base-price: 20000
    multiplier: 2.0

economy:
  # ชื่อสกุลเงินและสัญลักษณ์หน้าตัวเลข
  currency-name: "เหรียญ"
  currency-symbol: "₡"
  # เงินที่คนใหม่ได้ตอนเข้าเซิร์ฟครั้งแรก
  starting-balance: 1000
  # โอนขั้นต่ำต่อครั้ง
  pay-minimum: 1
  # ยกเงินของเราให้ปลั๊กอินอื่นใช้ผ่าน Vault
  register-with-vault: true

spawn:
  # จุดเกิดของเซิร์ฟ (ใช้เมื่อยังไม่เคย /setspawn)
  world: lobby
  x: 0.5
  y: 100
  z: 0.5
  yaw: 0
  pitch: 0
  # พาคนเข้าเซิร์ฟครั้งแรกมาที่จุดเกิด
  teleport-on-first-join: true
  # ตายแล้วเกิดที่จุดเกิดเสมอ (ถ้าไม่ได้นอนเตียงไว้)
  respawn-at-spawn: false

homes:
  # จำนวนบ้านพื้นฐานของทุกคน
  default-limit: 1
  # เพิ่มให้ยศสูงด้วยสิทธิ์ zones.homes.<เลข> เช่น zones.homes.5
  permission-ceiling: 20

teleport:
  # นับถอยหลังก่อนวาร์ป ขยับตัวแล้วยกเลิก (0 = วาร์ปทันที)
  warmup-seconds: 3
  # คำขอวาร์ปหมดอายุในกี่วินาที
  request-seconds: 60

missions:
  # เด้งตัวหนังสือกลางจอตอนผ่านขั้น (false = ใช้แถบเหนือช่องไอเทมแทน)
  popup: true
  # ประกาศทั้งเซิร์ฟเมื่อมีคนทำภารกิจครบทุกขั้น
  broadcast-final: true
  # ตรวจความคืบหน้าทุกกี่ tick (100 = 5 วินาที)
  check-interval-ticks: 100

notify:
  # เปิด/ปิดเสียงประกอบการแจ้งเตือนทั้งหมด
  sound: true

protection:
  block-break: true
  block-place: true
  containers: true
  pvp: true
  explosions: true
  fire: true
  buckets: true
  entities: true
  pistons: true

effects:
  enter: "<green>▶ <white>เข้าเขตของ <yellow><owner>"
  leave: "<gray>◀ <white>ออกจากเขตของ <yellow><owner>"
  enter-own: "<green>▶ <white>กลับเข้าเขตของคุณ"
  leave-own: "<gray>◀ <white>ออกจากเขตของคุณ"
  sound-enter: "block.note_block.pling"
  sound-leave: "block.note_block.bass"
  sound-volume: 0.7
  sound-pitch-enter: 1.6
  sound-pitch-leave: 0.8
  # แสดงขอบเขตด้วยอนุภาคตอนสร้าง/อัปเกรด
  show-border: true
  # จำนวนจังหวะที่กะพริบก่อนจางหาย (มากขึ้น = อยู่นานขึ้น)
  border-pulses: 12
  # ห่างกันกี่ tick ต่อจังหวะ (20 tick = 1 วินาที)
  border-period-ticks: 7

messages:
  prefix: "<gold>[เขต] <reset>"
  created: "<green>สร้างเขตเรียบร้อย รัศมี <yellow><radius> <green>บล็อก"
  removed: "<yellow>ลบเขตแล้ว"
  no-slots: "<red>เขตเต็มแล้ว ซื้อช่องเพิ่มที่เมนูบีคอน (<yellow><price> <red>เหรียญ)"
  overlap: "<red>ตรงนี้ชนกับเขตของคนอื่น หาที่ใหม่"
  blocked-world: "<red>สร้างเขตในโลกนี้ไม่ได้"
  deny-build: "<red>ที่นี่เป็นเขตของ <yellow><owner>"
  deny-container: "<red>หีบนี้อยู่ในเขตของ <yellow><owner>"
  deny-pvp: "<red>ตีกันในเขตไม่ได้"
  not-owner: "<red>คุณไม่ใช่เจ้าของเขตนี้"
  no-money: "<red>เงินไม่พอ ต้องมี <yellow><price> <red>เหรียญ"
  upgraded: "<green>ขยายเขตเป็นรัศมี <yellow><radius> <green>แล้ว"
  slot-bought: "<green>ซื้อช่องเขตเพิ่มแล้ว ตอนนี้มี <yellow><slots> <green>ช่อง"
  max-radius: "<yellow>เขตนี้ขยายสุดแล้ว"
  no-economy: "<red>ระบบเงินยังไม่พร้อม ติดต่อแอดมิน"
  member-added: "<green>เพิ่ม <yellow><player> <green>เข้าเขตแล้ว"
  member-removed: "<yellow>เอา <white><player> <yellow>ออกจากเขตแล้ว"
  reloaded: "<green>โหลดค่าใหม่แล้ว"
