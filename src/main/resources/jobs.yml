# ─────────────────────────────────────────────────────────────
# อาชีพ — แก้ได้ทุกบรรทัด เพิ่มอาชีพใหม่ได้เลย
#
# โครงของแต่ละอาชีพ
#   display          ชื่อที่โชว์ (ใช้ MiniMessage ใส่สีได้)
#   icon             บล็อก/ไอเทมที่ใช้เป็นไอคอนในเมนู
#   max-level        เลเวลสูงสุด
#   base-xp          xp ที่ต้องใช้ไปเลเวล 2
#   curve            แต่ละเลเวลถัดไปต้องใช้ xp คูณเท่านี้ (1.18 = +18%)
#   bonus-per-level  ค่าตอบแทนเพิ่มต่อเลเวล (0.012 = +1.2% ต่อเลเวล)
#
#   pay.break.<บล็อก>   ได้เงิน/xp เมื่อขุดบล็อกนั้น
#   pay.place.<บล็อก>   เมื่อวางบล็อกนั้น
#   pay.kill.<มอน>      เมื่อฆ่ามอนตัวนั้น
#   pay.craft.<ไอเทม>   เมื่อคราฟต์ไอเทมนั้น
#   pay.fish.ANY        เมื่อตกปลาได้ (ใส่ชื่อปลาเจาะจงก็ได้)
#
#   rewards.<เลเวล>     รางวัลตอนขึ้นเลเวลนั้น
#     money / commands / note     (<player> = ชื่อคนเล่น)
#
# ชื่อบล็อกกับมอนใช้ชื่อของไมน์คราฟต์ เช่น DIAMOND_ORE, ZOMBIE
# ขุดบล็อกที่ตัวเองวางเองจะไม่ได้เงิน (กันปั๊ม) ปิดได้ที่ config.yml
# ─────────────────────────────────────────────────────────────

