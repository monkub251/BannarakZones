# ===== ยศ — ผูกกับ Discord =====
# ไม่มีการไต่ยศหรือซื้อยศในเกมแล้ว ยศมาจาก role ในดิสคอร์ดล้วน ๆ
#
# วิธีใช้
#   1. ในดิสคอร์ด เปิดโหมดนักพัฒนา แล้วคลิกขวาที่ role → คัดลอก ID
#   2. เอา ID มาใส่ช่อง discord-role ของยศนั้น
#   3. ผู้เล่นพิมพ์ /rank ในเกม จะได้รหัส 6 หลัก
#   4. เอารหัสไปยืนยันกับบอท บอทยิงเข้า /api/discord/link ของแผงเว็บ
#   5. role เปลี่ยนเมื่อไหร่ บอทยิง /api/discord/roles ยศในเกมเปลี่ยนตาม
#
# ช่องที่ใช้
#   display      ชื่อยศที่โชว์ในแถบข้อมูลข้างจอ
#   prefix       ข้อความหน้าชื่อในแชท
#   order        เลขมากชนะ ถ้ามีหลาย role พร้อมกัน
#   discord-role ID ของ role ในดิสคอร์ด เว้นว่าง = ยศพื้นฐาน
#   permissions  สิทธิ์ที่ได้ เช่น zones.homes.3 = ตั้งบ้านได้ 3 หลัง
#
# ยศแรกสุด (order ต่ำสุด) คือยศของคนที่ยังไม่ผูกบัญชี

ranks:

  newbie:
    display: "<gray>[ชาวบ้าน]"
    prefix: "<gray>[ชาวบ้าน] "
    order: 0
    discord-role: ""
    permissions:
      - zones.homes.1

  settler:
    display: "<green>[ชาวเมือง]"
    prefix: "<green>[ชาวเมือง] "
    order: 10
    discord-role: ""
    permissions:
      - zones.homes.2

  merchant:
    display: "<aqua>[พ่อค้า]"
    prefix: "<aqua>[พ่อค้า] "
    order: 20
    discord-role: ""
    permissions:
      - zones.homes.3

  veteran:
    display: "<light_purple>[ขาประจำ]"
    prefix: "<light_purple>[ขาประจำ] "
    order: 30
    discord-role: ""
    permissions:
      - zones.homes.5

  legend:
    display: "<gold>[ตำนาน]"
    prefix: "<gold>[ตำนาน] "
    order: 40
    discord-role: ""
    permissions:
      - zones.homes.8

  vip:
    display: "<yellow>[VIP]"
    prefix: "<yellow>[VIP] "
    order: 25
    discord-role: ""
    permissions:
      - zones.homes.4

  vipplus:
    display: "<gold>[VIP+]"
    prefix: "<gold>[VIP+] "
    order: 35
    discord-role: ""
    permissions:
      - zones.homes.6

  # ───── ยศทีมงาน ตั้งให้กันเองจากแผงเว็บ ไม่มีทางได้มาด้วยการเล่น ─────
  staff:
    display: "<aqua>[ทีมงาน]"
    prefix: "<aqua>[ทีมงาน] "
    order: 90
    discord-role: ""
    permissions: ["zones.homes.10"]

  owner:
    display: "<gradient:#f0cf8a:#b8863a><bold>[เจ้าของ]</bold></gradient>"
    prefix: "<gradient:#f0cf8a:#b8863a><bold>[เจ้าของ]</bold></gradient> "
    order: 100
    discord-role: ""
    permissions: ["zones.homes.20"]
