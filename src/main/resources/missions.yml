# ===== ภารกิจ =====
# แก้ไฟล์นี้แล้วพิมพ์ /zone reload ในเกม
#
# statistic : ชื่อสถิติของ Minecraft (ดูรายชื่อเต็มได้ในเอกสาร Bukkit Statistic)
# material / entity : ใส่เมื่อสถิติต้องระบุชนิดบล็อกหรือชนิดมอบ
# scale : ตัวหารให้เป็นหน่วยที่คนเล่นเข้าใจ (ระยะทางเก็บเป็นเซนติเมตร 100 = 1 บล็อก)
# tiers : <จำนวน>: reward: <เงิน>  — ใส่กี่ขั้นก็ได้ เรียงจากน้อยไปมาก
#         ใส่ commands: ["give <player> diamond 1"] เพิ่มของแถมได้

