# ไฟล์นี้มีเลขเวอร์ชัน ถ้าปลั๊กอินมีเมนูใหม่กว่า มันจะสำรองของเดิมเป็น .bak แล้ววางของใหม่ให้
version: 4

# ===== เมนูของเซิร์ฟ =====
# แก้ไฟล์นี้แล้วพิมพ์ /zone reload
#
# slot นับจาก 0 ซ้ายบน ไปขวา แถวละ 9 ช่อง
# actions ใส่ได้หลายบรรทัด ทำงานเรียงจากบนลงล่าง:
#   <คำสั่ง>          สั่งในนามผู้เล่น เช่น  spawn
#   console:<คำสั่ง>   สั่งในนามเซิร์ฟ เช่น  console:give <player> bread 1
#   open:<ชื่อเมนู>    เปิดอีกเมนู
#   panel:blocks      เปิดหน้าบล็อกพิเศษ
#   panel:pshop       เปิดร้านพ้อย
#   prompt:<ชื่อ>      หน้าต่างเลือกคน/พิมพ์ (msg ignore tpa pay)
#   message:<ข้อความ>  ส่งข้อความ
#   sound:<ชื่อเสียง>  เล่นเสียง
#   close             ปิดเมนู
#
# ตัวแปรที่ใช้ได้ใน name/lore: <player> <money> <zones> <slots> <homes>

menus:

  # ───────────────────────────────────────────────────────────
  # หน้าหลัก — 6 หมวด ไม่ต้องจำคำสั่งอะไรเลย
  # ───────────────────────────────────────────────────────────
  main:
    title: "<dark_gray>ᴍᴇɴᴜ <gray>· <gold>BANNARAKX"
    rows: 6
    filler: BLACK_STAINED_GLASS_PANE
    items:
      4:
        icon: PLAYER_HEAD
        name: "<gradient:#f0cf8a:#b8863a><bold><player></bold></gradient>"
        lore:
          - ""
          - "<gray>เงิน <gold><money>"
          - "<gray>เขตที่มี <white><zones><dark_gray>/<gray><slots>"
          - "<gray>บ้านที่ตั้งไว้ <white><homes>"

      # ── แถวบน: ตัวเรา ──
      10:
        icon: RED_BED
        name: "<yellow>บ้านของฉัน"
        lore:
          - "<gray>กลับบ้าน · ตั้งบ้าน · ลบบ้าน"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "open:homes" ]

      11:
        icon: BEACON
        name: "<light_purple>เขตป้องกันของฉัน"
        lore:
          - "<gray>ดูเขตที่จับจองไว้"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "open:land" ]

      12:
        icon: GOLD_INGOT
        name: "<gold>เงินและพ้อย"
        lore:
          - "<gray>เงิน <gold><money>"
          - "<gray>โอนเงิน · อันดับคนรวย · พ้อย"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "open:wallet" ]

      13:
        icon: NAME_TAG
        name: "<light_purple>ยศของฉัน"
        lore:
          - "<gray>ดูยศ และผูกบัญชีดิสคอร์ด"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "rank" ]

      14:
        icon: TRIPWIRE_HOOK
        name: "<yellow>กล่องสุ่มและกุญแจ"
        lore:
          - "<gray>ดูกล่องทั้งหมดและของข้างใน"
          - "<gray>กุญแจได้จากรางวัลรายวันและภารกิจ"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "crate list" ]

      # ── แถวกลาง: หาเงิน ──
      19:
        icon: EMERALD
        name: "<green>ร้านรับซื้อ"
        lore:
          - "<gray>เอาของมาขายให้เซิร์ฟ"
          - "<dark_gray>เซิร์ฟไม่ขายของ ซื้อกันเองที่ตลาด"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "shop" ]

      20:
        icon: CHEST_MINECART
        name: "<aqua>ตลาดกลาง"
        lore:
          - "<gray>ซื้อของจากผู้เล่นคนอื่น"
          - "<gray>ของทุกชิ้นในเซิร์ฟมาจากตรงนี้"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "market" ]

      21:
        icon: WRITTEN_BOOK
        name: "<gold>ภารกิจ"
        lore:
          - "<gray>ทำภารกิจรับเงิน 16 อย่าง"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "mission" ]

      22:
        icon: SUNFLOWER
        name: "<green>รางวัลรายวัน"
        lore:
          - "<gray>เข้ามาทุกวันรับเงินเพิ่มขึ้นเรื่อย ๆ"
          - ""
          - "<green>▸ คลิกเพื่อรับ"
        actions: [ "daily" ]

      23:
        icon: ENDER_CHEST
        name: "<yellow>กล่องสุ่ม"
        lore:
          - "<gray>ดูว่ากล่องไหนออกอะไรบ้าง"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "crate list" ]

      24:
        icon: WITHER_SKELETON_SKULL
        name: "<dark_red>ดันเจียน"
        lore:
          - "<gray>50 เวฟ บอส 2 ตัว เล่น 3-5 คน"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "dungeon" ]

      # ── แถวล่าง: เดินทาง ──
      28:
        icon: RECOVERY_COMPASS
        name: "<white>จุดเกิด"
        lore:
          - "<gray>กลับไปที่สปอว์น"
          - ""
          - "<green>▸ คลิกเพื่อไป"
        actions: [ "spawn" ]

      29:
        icon: ENDER_PEARL
        name: "<aqua>วาร์ป"
        lore:
          - "<gray>ไปจุดที่ทีมงานตั้งไว้"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "warp" ]

      30:
        icon: COMPASS
        name: "<gold>ออกสำรวจ"
        lore:
          - "<gray>สุ่มวาร์ปไปที่ไกล ๆ หาที่สร้างบ้าน"
          - ""
          - "<green>▸ คลิกเพื่อไป"
        actions: [ "rtp" ]

      31:
        icon: LEAD
        name: "<green>ขอวาร์ปหาเพื่อน"
        lore:
          - "<gray>ส่งคำขอไปหาคนที่ออนไลน์อยู่"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "prompt:tpa" ]

      32:
        icon: PAPER
        name: "<aqua>แชตและเพื่อน"
        lore:
          - "<gray>ส่งข้อความส่วนตัว · ปิดแชตคนกวน"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "open:social" ]

      # ── ล่างสุด ──
      48:
        icon: SUNFLOWER
        name: "<gold>ร้านพ้อย"
        lore:
          - "<gray>สีชื่อ · สัตว์เลี้ยง · ของตกแต่ง"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "panel:pshop" ]

      49:
        icon: BOOK
        name: "<yellow>คำสั่งทั้งหมด"
        lore:
          - "<gray>สำหรับคนที่ชอบพิมพ์คำสั่ง"
          - ""
          - "<green>▸ คลิกเพื่อดู"
        actions: [ "commands", "close" ]

      50:
        icon: CLOCK
        name: "<white>สถานะเซิร์ฟ"
        lore:
          - "<gray>ดูว่ามีใครออนไลน์บ้าง"
          - ""
          - "<green>▸ คลิกเพื่อดู"
        actions: [ "baltop" ]

      45:
        icon: WRITTEN_BOOK
        name: "<yellow>กฎเซิร์ฟ"
        lore:
          - "<gray>อ่านก่อนเล่น จะได้ไม่โดนแบน"
          - ""
          - "<green>▸ คลิกเพื่ออ่าน"
        actions: [ "rules", "close" ]

      46:
        icon: PAPER
        name: "<aqua>แจ้งเรื่องถึงแอดมิน"
        lore:
          - "<gray>โดนโกง เจอบั๊ก หรือมีปัญหา"
          - "<gray>เรื่องจะไปโผล่ในดิสคอร์ดทีมงาน"
          - ""
          - "<green>▸ คลิกแล้วพิมพ์เรื่องได้เลย"
        actions: [ "ticket" ]

      47:
        icon: GOLDEN_HELMET
        name: "<gold>ยศพิเศษ"
        lore:
          - "<gray>ยศเท่ ๆ หน้าชื่อในแชต ซื้อด้วยพ้อย"
          - "<gray>ยิ่งแพงยิ่งสวย"
          - ""
          - "<green>▸ คลิกเพื่อเปิดร้าน"
        actions: [ "panel:titles" ]

      53:
        icon: PLAYER_HEAD
        name: "<light_purple>ตั้งสกิน"
        lore:
          - "<gray>เซิร์ฟนี้ดึงสกินเองไม่ได้ ทุกคนจึงเป็นสกินเริ่มต้น"
          - "<gray>กดแล้วพิมพ์ชื่อบัญชีที่มีสกินที่อยากได้"
          - ""
          - "<green>▸ คลิกเพื่อตั้ง"
        actions: [ "prompt:skin" ]

      52:
        icon: ANVIL
        name: "<aqua>ซ่อมของ"
        lore:
          - "<gray>ซ่อมของที่ถืออยู่ คิดตามความเสียหายจริง"
          - "<gray>ของเกือบใหม่ซ่อมถูก ของพังยับซ่อมแพง"
          - ""
          - "<green>▸ คลิกเพื่อซ่อม"
        actions: [ "repair" ]

      51:
        icon: IRON_DOOR
        name: "<light_purple>เปลี่ยนรหัสผ่าน"
        lore:
          - "<gray>เปลี่ยนรหัสที่ใช้ล็อกอินเข้าเซิร์ฟ"
          - ""
          - "<green>▸ คลิกเพื่อเปลี่ยน"
        actions: [ "prompt:password" ]


  # ───────────────────────────────────────────────────────────
  land:
    title: "<dark_gray>เขตป้องกัน"
    rows: 3
    filler: BLACK_STAINED_GLASS_PANE
    items:
      11:
        icon: BEACON
        name: "<light_purple>เขตของฉัน"
        lore:
          - "<gray>มีอยู่ <white><zones><dark_gray>/<gray><slots> <gray>เขต"
          - ""
          - "<green>▸ คลิกเพื่อดู"
        actions: [ "zone list" ]

      13:
        icon: BEACON
        name: "<aqua>รับบล็อกจับจอง"
        lore:
          - "<gray>วางลงพื้นเพื่อจับจองที่ดิน"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "panel:blocks" ]

      15:
        icon: WRITTEN_BOOK
        name: "<yellow>วิธีใช้"
        lore:
          - "<gray>วางบล็อกจับจอง แล้วคลิกขวาที่บล็อกนั้น"
          - "<gray>เพื่อเพิ่มเพื่อน ขยายเขต หรือลบเขต"
        actions: [ "zone", "close" ]

      22:
        icon: ARROW
        name: "<white>กลับหน้าหลัก"
        actions: [ "open:main" ]

  # ───────────────────────────────────────────────────────────
  wallet:
    title: "<dark_gray>เงินและพ้อย"
    rows: 3
    filler: BLACK_STAINED_GLASS_PANE
    items:
      10:
        icon: GOLD_INGOT
        name: "<gold>เงินของฉัน"
        lore:
          - "<gold><money>"
        actions: [ "money", "close" ]

      11:
        icon: PAPER
        name: "<green>โอนเงินให้เพื่อน"
        lore:
          - "<gray>ใช้คำสั่ง <white>/pay <ชื่อ> <จำนวน>"
        actions: [ "prompt:pay" ]

      12:
        icon: DIAMOND
        name: "<aqua>อันดับคนรวย"
        actions: [ "baltop", "close" ]

      14:
        icon: SUNFLOWER
        name: "<gold>พ้อยของฉัน"
        lore:
          - "<gray>พ้อยใช้ซื้อของตกแต่ง"
          - "<dark_gray>ซื้อเงินหรือไอเทมไม่ได้"
        actions: [ "points", "close" ]

      15:
        icon: NETHER_STAR
        name: "<light_purple>ร้านพ้อย"
        lore:
          - "<gray>สีชื่อ · สัตว์เลี้ยง · ของตกแต่ง"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions: [ "panel:pshop" ]

      16:
        icon: EMERALD
        name: "<green>เติมพ้อย"
        lore:
          - "<gray>ดูวิธีเติม"
        actions: [ "topup", "close" ]

      22:
        icon: ARROW
        name: "<white>กลับหน้าหลัก"
        actions: [ "open:main" ]

  # ───────────────────────────────────────────────────────────
  social:
    title: "<dark_gray>แชตและเพื่อน"
    rows: 3
    filler: BLACK_STAINED_GLASS_PANE
    items:
      11:
        icon: PAPER
        name: "<aqua>ส่งข้อความส่วนตัว"
        lore:
          - "<gray>ใช้คำสั่ง <white>/msg <ชื่อ> <ข้อความ>"
          - "<gray>ตอบกลับด้วย <white>/r <ข้อความ>"
        actions: [ "prompt:msg" ]

      13:
        icon: BARRIER
        name: "<red>ปิดแชตคนกวน"
        lore:
          - "<gray>ใช้คำสั่ง <white>/ignore <ชื่อ>"
          - "<gray>พิมพ์อีกครั้งเพื่อเปิดกลับ"
        actions: [ "prompt:ignore" ]

      15:
        icon: LEAD
        name: "<green>ขอวาร์ปหาเพื่อน"
        actions: [ "prompt:tpa" ]

      22:
        icon: ARROW
        name: "<white>กลับหน้าหลัก"
        actions: [ "open:main" ]


  # ───────────────────────────────────────────────────────────
  homes:
    title: "<dark_gray>บ้านของฉัน"
    rows: 3
    filler: BLACK_STAINED_GLASS_PANE
    items:
      11:
        icon: RED_BED
        name: "<yellow>ไปบ้าน"
        lore:
          - "<gray>ตั้งไว้ <white><homes> <gray>หลัง"
        actions: [ "home" ]

      13:
        icon: OAK_DOOR
        name: "<green>ตั้งบ้านตรงนี้"
        actions: [ "sethome" ]

      15:
        icon: BARRIER
        name: "<red>ลบบ้าน"
        lore:
          - "<gray>ใช้คำสั่ง <white>/delhome <ชื่อบ้าน>"
        actions: [ "message:<gray>ใช้คำสั่ง <white>/delhome <ชื่อบ้าน>", "close" ]

      22:
        icon: ARROW
        name: "<white>กลับหน้าหลัก"
        actions: [ "open:main" ]

