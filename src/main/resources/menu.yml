# ===== เมนูของเซิร์ฟ =====
# แก้ไฟล์นี้แล้วพิมพ์ /zone reload
#
# slot นับจาก 0 ซ้ายบน ไปขวา แถวละ 9 ช่อง
# actions ใส่ได้หลายบรรทัด ทำงานเรียงจากบนลงล่าง:
#   <คำสั่ง>          สั่งในนามผู้เล่น เช่น  spawn
#   console:<คำสั่ง>   สั่งในนามเซิร์ฟ เช่น  console:give <player> bread 1
#   open:<ชื่อเมนู>    เปิดอีกเมนู
#   message:<ข้อความ>  ส่งข้อความ
#   sound:<ชื่อเสียง>  เล่นเสียง
#   close             ปิดเมนู
#
# ตัวแปรที่ใช้ได้ใน name/lore: <player> <money> <zones> <slots> <homes>

menus:

  # ───────────────────────────────────────────────────────────
  # หน้าหลัก — จัดเป็น 3 แถว แถวละเรื่อง
  #   แถวบน  : ตัวเรา   (บ้าน เขต เงิน)
  #   แถวกลาง: หาเงิน   (ร้าน ตลาด ภารกิจ รางวัล กล่องสุ่ม)
  #   แถวล่าง: เดินทาง + ของอื่น
  # ───────────────────────────────────────────────────────────
  main:
    title: "<dark_gray>ᴍᴇɴᴜ <gray>· <gold>BANNARAKX"
    rows: 6
    filler: BLACK_STAINED_GLASS_PANE
    items:
      4:
        icon: PLAYER_HEAD
        name: "<gradient:#f0cf8a:#b8863a><bold><player></bold></gradient>"
        lore:
          - ""
          - "<gray>เงิน <gold><money>"
          - "<gray>เขตที่มี <white><zones><dark_gray>/<gray><slots>"
          - "<gray>บ้านที่ตั้งไว้ <white><homes>"
          - ""
          - "<dark_gray>พิมพ์ /commands ดูคำสั่งทั้งหมด"

      10:
        icon: RED_BED
        name: "<yellow>บ้านของฉัน"
        lore:
          - "<gray>กลับบ้าน · ตั้งบ้าน · ลบบ้าน"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions:
          - "open:homes"
      11:
        icon: BEACON
        name: "<light_purple>เขตป้องกันของฉัน"
        lore:
          - "<gray>ดูเขตทั้งหมดที่จองไว้"
          - "<dark_gray>วางบีคอนเพื่อสร้างเขตใหม่"
          - ""
          - "<green>▸ คลิกเพื่อดู"
        actions:
          - "zone list"
      12:
        icon: GOLD_INGOT
        name: "<gold>กระเป๋าเงิน"
        lore:
          - "<gray>ตอนนี้มี <gold><money>"
          - "<dark_gray>/pay <ชื่อ> <จำนวน> เพื่อโอน"
          - ""
          - "<green>▸ ดูอันดับคนรวย"
        actions:
          - "baltop"
      13:
        icon: NAME_TAG
        name: "<light_purple>ยศของฉัน"
        lore:
          - "<gray>ยศมาจาก role ในดิสคอร์ด"
          - "<gray>ผูกบัญชีครั้งเดียว ใช้ได้ตลอด"
          - ""
          - "<green>▸ ขอรหัสผูกบัญชี"
        actions:
          - "rank"

      19:
        icon: EMERALD
        name: "<green>ร้านค้าของเซิร์ฟ"
        lore:
          - "<gray>ซื้อขายกับเซิร์ฟ ราคาคงที่"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions:
          - "shop"
      20:
        icon: CHEST_MINECART
        name: "<aqua>ตลาดกลาง"
        lore:
          - "<gray>ซื้อขายกับผู้เล่นคนอื่น"
          - "<dark_gray>/sell <ราคา> เพื่อลงขายของในมือ"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions:
          - "market"
      21:
        icon: WRITTEN_BOOK
        name: "<gold>ภารกิจ"
        lore:
          - "<gray>ทำครบรับรางวัล มีหลายขั้น"
          - ""
          - "<green>▸ คลิกเพื่อดู"
        actions:
          - "mission"
      22:
        icon: SUNFLOWER
        name: "<green>รางวัลรายวัน"
        lore:
          - "<gray>เข้าเซิร์ฟทุกวันรับของ 7 วันวน"
          - ""
          - "<green>▸ คลิกเพื่อรับ"
        actions:
          - "daily"
      23:
        icon: ENDER_CHEST
        name: "<yellow>กล่องสุ่ม"
        lore:
          - "<gray>ใช้กุญแจเปิดกล่อง ลุ้นของหายาก"
          - ""
          - "<green>▸ คลิกเพื่อดู"
        actions:
          - "crate list"

      28:
        icon: RECOVERY_COMPASS
        name: "<white>จุดเกิด"
        lore:
          - "<gray>กลับไปจุดเริ่มต้นของเซิร์ฟ"
          - ""
          - "<green>▸ คลิกเพื่อไป"
        actions:
          - "spawn"
      29:
        icon: ENDER_PEARL
        name: "<aqua>วาร์ป"
        lore:
          - "<gray>จุดสำคัญที่ทีมงานตั้งไว้"
          - ""
          - "<green>▸ คลิกเพื่อดู"
        actions:
          - "warp"
      30:
        icon: COMPASS
        name: "<gold>ออกสำรวจ"
        lore:
          - "<gray>สุ่มส่งไปที่ไกล ๆ ในโลกหลัก"
          - "<dark_gray>หาที่ลงที่ปลอดภัยให้อัตโนมัติ"
          - ""
          - "<green>▸ คลิกเพื่อไป"
        actions:
          - "rtp"
      31:
        icon: LEAD
        name: "<green>ขอวาร์ปหาเพื่อน"
        lore:
          - "<dark_gray>/tpa <ชื่อ> เพื่อส่งคำขอ"
          - ""
          - "<green>▸ ดูวิธีใช้"
        actions:
          - "tpa"
      32:
        icon: WITHER_SKELETON_SKULL
        name: "<dark_red>ดันเจียน"
        lore:
          - "<gray>50 เวฟ บอสรองเวฟ 49 บอสใหญ่เวฟ 50"
          - "<gray>ลงได้ 3-5 คน · คูลดาวน์ 10 ชั่วโมง"
          - "<red>เตรียมของได้รอบเดียว ตายคือจบ"
          - ""
          - "<green>▸ คลิกเพื่อเข้า"
        actions:
          - "dungeon"

      49:
        icon: BOOK
        name: "<yellow>คำสั่งทั้งหมด"
        lore:
          - "<gray>ดูทุกคำสั่งที่คุณใช้ได้"
          - "<dark_gray>กดที่คำสั่งเพื่อพิมพ์ลงแชต"
          - ""
          - "<green>▸ คลิกเพื่อดู"
        actions:
          - "commands"
          - "close"
      53:
        icon: COMMAND_BLOCK
        name: "<red>แผงทีมงาน"
        lore:
          - "<dark_gray>เฉพาะทีมงานเท่านั้น"
          - ""
          - "<green>▸ คลิกเพื่อเปิด"
        actions:
          - "admin"

  # ───────────────────────────────────────────────────────────
  homes:
    title: "<dark_gray>ʜᴏᴍᴇ <gray>· บ้านของฉัน"
    rows: 3
    filler: BLACK_STAINED_GLASS_PANE
    items:
      11:
        icon: RED_BED
        name: "<yellow>ไปบ้าน"
        lore:
          - "<gray>ตั้งไว้ <white><homes> <gray>หลัง"
          - "<dark_gray>/home <ชื่อ> ถ้ามีหลายหลัง"
          - ""
          - "<green>▸ คลิกเพื่อไป"
        actions:
          - "home"
      13:
        icon: OAK_DOOR
        name: "<green>ตั้งบ้านตรงนี้"
        lore:
          - "<gray>จำตำแหน่งที่ยืนอยู่เป็นบ้าน"
          - "<dark_gray>/sethome <ชื่อ> เพื่อตั้งชื่อเอง"
          - ""
          - "<green>▸ คลิกเพื่อตั้ง"
        actions:
          - "sethome"
      15:
        icon: BARRIER
        name: "<red>ลบบ้าน"
        lore:
          - "<dark_gray>/delhome <ชื่อบ้าน>"
        actions:
          - "message:<gray>ใช้คำสั่ง <white>/delhome <ชื่อบ้าน>"
          - "close"
      22:
        icon: ARROW
        name: "<white>กลับหน้าหลัก"
        actions:
          - "open:main"

  # ───────────────────────────────────────────────────────────
  # ทางลัดของทีมงาน — ของที่เคยหลงไปอยู่ในหน้าบ้าน ย้ายมาที่นี่
  # ───────────────────────────────────────────────────────────
  admin:
    title: "<dark_gray>sᴛᴀғғ <gray>· ทางลัดทีมงาน"
    rows: 4
    filler: BLACK_STAINED_GLASS_PANE
    items:
      10:
        icon: COMPASS
        name: "<yellow>ตั้งจุดเกิดตรงนี้"
        actions:
          - "setspawn"
      11:
        icon: ENDER_PEARL
        name: "<aqua>ตั้งวาร์ปตรงนี้"
        lore:
          - "<dark_gray>/setwarp <ชื่อ> [ICON]"
        actions:
          - "message:<gray>ใช้คำสั่ง <white>/setwarp <ชื่อ> [ICON]"
          - "close"
      12:
        icon: IRON_BARS
        name: "<dark_red>ตั้งห้องขังตรงนี้"
        actions:
          - "setjail"
      13:
        icon: STICK
        name: "<gold>รับไม้ทีมงาน"
        lore:
          - "<gray>ตีได้ไกลมาก · วาร์ปตามที่เล็ง"
        actions:
          - "astick"
      14:
        icon: BEACON
        name: "<light_purple>แผงข้างจอ"
        lore:
          - "<gray>เปิด-ปิดแถบสถานะเซิร์ฟ"
        actions:
          - "adminhud"

      19:
        icon: NETHERITE_SWORD
        name: "<gold>ไอเทมของเซิร์ฟ"
        actions:
          - "citem list"
      20:
        icon: TRIPWIRE_HOOK
        name: "<aqua>แจกกุญแจกล่อง"
        lore:
          - "<dark_gray>/crate key <กล่อง> <ผู้เล่น> [จำนวน]"
        actions:
          - "message:<gray>ใช้คำสั่ง <white>/crate key <ชื่อกล่อง> <ผู้เล่น> [จำนวน]"
          - "close"
      21:
        icon: WITHER_SKELETON_SKULL
        name: "<dark_red>ตั้งจุดเริ่มดันเจียน"
        actions:
          - "dungeon setspawn"
      22:
        icon: GOLD_INGOT
        name: "<gold>จัดการเงิน"
        lore:
          - "<dark_gray>/eco give|take|set <ชื่อ> <จำนวน>"
        actions:
          - "message:<gray>ใช้คำสั่ง <white>/eco give|take|set <ชื่อ> <จำนวน>"
          - "close"
      23:
        icon: STRUCTURE_BLOCK
        name: "<green>สำรองข้อมูลเดี๋ยวนี้"
        actions:
          - "backup"
      24:
        icon: COMMAND_BLOCK
        name: "<red>แผงควบคุมเต็ม"
        lore:
          - "<gray>6 แท็บ จัดการได้ทุกอย่าง"
        actions:
          - "admin"

      30:
        icon: REPEATER
        name: "<green>โหลดค่าใหม่"
        lore:
          - "<gray>อ่านไฟล์ตั้งค่าทั้งหมดใหม่"
        actions:
          - "zone reload"
      31:
        icon: ARROW
        name: "<white>กลับหน้าหลัก"
        actions:
          - "open:main"
