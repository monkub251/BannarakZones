# ===== เมนูของเซิร์ฟ =====
# แก้ไฟล์นี้แล้วพิมพ์ /zone reload
#
# slot นับจาก 0 ซ้ายบน ไปขวา แถวละ 9 ช่อง
# actions ใส่ได้หลายบรรทัด ทำงานเรียงจากบนลงล่าง:
#   <คำสั่ง>          สั่งในนามผู้เล่น เช่น  spawn
#   console:<คำสั่ง>   สั่งในนามเซิร์ฟ เช่น  console:give <player> bread 1
#   open:<ชื่อเมนู>    เปิดอีกเมนู
#   panel:blocks      เปิดหน้าบล็อกพิเศษ
#   panel:pshop       เปิดร้านพ้อย
#   message:<ข้อความ>  ส่งข้อความ
#   sound:<ชื่อเสียง>  เล่นเสียง
#   close             ปิดเมนู
#
# ตัวแปรที่ใช้ได้ใน name/lore: <player> <money> <zones> <slots> <homes>

menus:

  # ───────────────────────────────────────────────────────────
  # หน้าหลัก — 6 หมวด ไม่ต้องจำคำสั่งอะไรเลย
  # ───────────────────────────────────────────────────────────
  main:
    title: "<dark_gray>ᴍᴇɴᴜ <gray>· <gold>BANNARAKX"
    rows: 6
    filler: BLACK_STAINED_GLASS_PANE
