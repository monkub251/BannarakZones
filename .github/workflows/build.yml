name: Build plugin

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'build-error.txt' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Pin newest paper-api 26.3 build
        run: |
          set -e
          META=https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
          V=$(curl -fsSL "$META" | grep -o '<version>26\.3[^<]*</version>' | sed 's/<[^>]*>//g' | tail -1)
          if [ -z "$V" ]; then
            V=$(curl -fsSL "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -1)
          fi
          echo "Using paper-api $V"
          sed -i "s|<paper.version>.*</paper.version>|<paper.version>$V</paper.version>|" pom.xml

      - name: Build
        id: build
        continue-on-error: true
        run: set -o pipefail; mvn -B -ntp package 2>&1 | tee build-output.txt

      - name: Record compile errors so they can be read from the repo
        if: steps.build.outcome == 'failure'
        run: |
          grep -E "ERROR|error:" build-output.txt | head -120 > build-error.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-error.txt
          git commit -m "ci: record build errors" || true
          git push || true

      - name: Stop here if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: BannarakZones-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BannarakZones (latest build)
          files: target/*.jar
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
