name: Build plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Pin newest paper-api 26.3 build
        run: |
          set -e
          META=https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
          V=$(curl -fsSL "$META" | grep -o '<version>26\.3[^<]*</version>' | sed 's/<[^>]*>//g' | tail -1)
          if [ -z "$V" ]; then
            V=$(curl -fsSL "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -1)
          fi
          echo "Using paper-api $V"
          sed -i "s|<paper.version>.*</paper.version>|<paper.version>$V</paper.version>|" pom.xml

      - name: Build
        run: mvn -B -ntp package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: BannarakZones-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BannarakZones (latest build)
          files: target/*.jar
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
